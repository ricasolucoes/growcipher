<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>O que aconteceu? - GrowCipher</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-error-container": "#ffdad6",
                        "on-secondary": "#233144",
                        "on-surface-variant": "#bacac5",
                        "surface-container-lowest": "#060e20",
                        "on-primary": "#003731",
                        "surface-tint": "#3cddc7",
                        "on-secondary-fixed": "#0d1c2f",
                        "secondary-fixed": "#d5e3fd",
                        "outline-variant": "#3c4a46",
                        "surface-container-low": "#131b2e",
                        "on-error": "#690005",
                        "tertiary-fixed": "#b0f0d6",
                        "tertiary-fixed-dim": "#95d3ba",
                        "outline": "#859490",
                        "surface": "#0b1326",
                        "primary-fixed": "#62fae3",
                        "tertiary-container": "#8ccbb2",
                        "surface-container": "#171f33",
                        "surface-bright": "#31394d",
                        "on-tertiary": "#003829",
                        "on-tertiary-fixed": "#002117",
                        "on-background": "#dae2fd",
                        "inverse-surface": "#dae2fd",
                        "surface-variant": "#2d3449",
                        "on-secondary-container": "#abb9d2",
                        "surface-dim": "#0b1326",
                        "surface-container-highest": "#2d3449",
                        "error-container": "#93000a",
                        "surface-container-high": "#222a3d",
                        "primary": "#57f1db",
                        "error": "#ffb4ab",
                        "tertiary": "#a8e7cd",
                        "on-primary-fixed-variant": "#005047",
                        "secondary-fixed-dim": "#b9c7e0",
                        "inverse-primary": "#006b5f",
                        "background": "#0b1326",
                        "on-tertiary-container": "#155743",
                        "inverse-on-surface": "#283044",
                        "on-tertiary-fixed-variant": "#0b513d",
                        "on-primary-container": "#00574d",
                        "on-primary-fixed": "#00201c",
                        "secondary": "#b9c7e0",
                        "on-surface": "#dae2fd",
                        "secondary-container": "#3c4a5e",
                        "on-secondary-fixed-variant": "#3a485c",
                        "primary-container": "#2dd4bf",
                        "primary-fixed-dim": "#3cddc7"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    spacing: {
                        "margin-mobile": "16px",
                        "container-padding": "24px",
                        "gutter": "16px",
                        "margin-desktop": "64px",
                        "base": "8px"
                    },
                    fontFamily: {
                        "body-md": ["Inter"],
                        "headline-lg": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-lg": ["Inter"],
                        "title-lg": ["Hanken Grotesk"],
                        "label-md": ["JetBrains Mono"],
                        "display-lg": ["Hanken Grotesk"],
                        "label-sm": ["JetBrains Mono"]
                    },
                    fontSize: {
                        "body-md": ["14px", { lineHeight: "20px", letterSpacing: "0.25px", fontWeight: "400" }],
                        "headline-lg": ["32px", { lineHeight: "40px", fontWeight: "600" }],
                        "headline-lg-mobile": ["28px", { lineHeight: "36px", fontWeight: "600" }],
                        "body-lg": ["16px", { lineHeight: "24px", letterSpacing: "0.5px", fontWeight: "400" }],
                        "title-lg": ["22px", { lineHeight: "28px", fontWeight: "500" }],
                        "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.5px", fontWeight: "500" }],
                        "display-lg": ["57px", { lineHeight: "64px", letterSpacing: "-0.25px", fontWeight: "700" }],
                        "label-sm": ["11px", { lineHeight: "16px", fontWeight: "500" }]
                    }
                }
            }
        };
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background dark:bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased">
<!-- TopAppBar (Transactional - Nav Shell Suppressed per guidelines, keeping only a basic back/close header) -->
<header class="flex justify-between items-center w-full px-margin-mobile h-16 bg-background">
<button class="w-10 h-10 flex items-center justify-center text-primary hover:opacity-80 transition-opacity rounded-full bg-surface-container">
<span class="material-symbols-outlined">close</span>
</button>
<div class="text-headline-md font-headline-md font-bold text-primary">GrowCipher</div>
<div class="w-10 h-10"></div> <!-- Spacer for balance -->
</header>
<main class="flex-grow px-margin-mobile md:px-margin-desktop py-container-padding flex flex-col max-w-screen-md mx-auto w-full">
<!-- Header Section -->
<div class="mb-8">
<h1 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg-mobile md:font-headline-lg text-primary mb-2">O que aconteceu?</h1>
<p class="text-body-lg font-body-lg text-on-surface-variant">Escolha algo para adicionar ao histórico da planta.</p>
</div>
<!-- Options Grid -->
<div class="grid grid-cols-2 md:grid-cols-3 gap-4">
<!-- Reguei -->
<button class="bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-high hover:border-primary transition-all group">
<span class="material-symbols-outlined text-[32px] text-tertiary-fixed group-hover:text-primary transition-colors">water_drop</span>
<span class="text-label-md font-label-md text-on-surface">Reguei</span>
</button>
<!-- Nutrientes -->
<button class="bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-high hover:border-primary transition-all group">
<span class="material-symbols-outlined text-[32px] text-tertiary-fixed group-hover:text-primary transition-colors">science</span>
<span class="text-label-md font-label-md text-on-surface">Nutrientes</span>
</button>
<!-- Tratamento -->
<button class="bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-high hover:border-primary transition-all group">
<span class="material-symbols-outlined text-[32px] text-tertiary-fixed group-hover:text-primary transition-colors">vaccines</span>
<span class="text-label-md font-label-md text-on-surface">Tratamento</span>
</button>
<!-- Medição -->
<button class="bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-high hover:border-primary transition-all group">
<span class="material-symbols-outlined text-[32px] text-tertiary-fixed group-hover:text-primary transition-colors">thermostat</span>
<span class="text-label-md font-label-md text-on-surface">Medição</span>
</button>
<!-- Transplante -->
<button class="bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-high hover:border-primary transition-all group">
<span class="material-symbols-outlined text-[32px] text-tertiary-fixed group-hover:text-primary transition-colors">potted_plant</span>
<span class="text-label-md font-label-md text-on-surface">Transplante</span>
</button>
<!-- Mudança de fase -->
<button class="bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-high hover:border-primary transition-all group">
<span class="material-symbols-outlined text-[32px] text-tertiary-fixed group-hover:text-primary transition-colors">eco</span>
<span class="text-label-md font-label-md text-on-surface">Fase</span>
</button>
<!-- Foto -->
<button class="bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-high hover:border-primary transition-all group">
<span class="material-symbols-outlined text-[32px] text-tertiary-fixed group-hover:text-primary transition-colors">photo_camera</span>
<span class="text-label-md font-label-md text-on-surface">Foto</span>
</button>
<!-- Observação -->
<button class="bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-high hover:border-primary transition-all group">
<span class="material-symbols-outlined text-[32px] text-tertiary-fixed group-hover:text-primary transition-colors">edit_note</span>
<span class="text-label-md font-label-md text-on-surface">Observação</span>
</button>
<!-- Problema -->
<button class="bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-high hover:border-error transition-all group">
<span class="material-symbols-outlined text-[32px] text-error group-hover:text-error transition-colors">warning</span>
<span class="text-label-md font-label-md text-error">Problema</span>
</button>
<!-- Colheita -->
<button class="bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-high hover:border-primary transition-all group">
<span class="material-symbols-outlined text-[32px] text-tertiary-fixed group-hover:text-primary transition-colors">content_cut</span>
<span class="text-label-md font-label-md text-on-surface">Colheita</span>
</button>
<!-- Encerrar planta -->
<button class="bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-high hover:border-on-surface-variant transition-all group md:col-span-2">
<span class="material-symbols-outlined text-[32px] text-on-surface-variant group-hover:text-on-surface transition-colors">flag</span>
<span class="text-label-md font-label-md text-on-surface-variant group-hover:text-on-surface">Encerrar</span>
</button>
</div>
</main>
</body></html>
