</div>

<span class="material-symbols-outlined text-primary text-[16px]" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-metadata text-metadata text-primary uppercase tracking-widest">Your grow stays yours</span>

</div>

                    Your Crop. <br/> Your Data. <br/> <span class="text-primary">Your Decisions.</span>
</h1>
<p class="font-body-main text-body-main text-on-surface-variant max-w-[280px]">

                </p>
