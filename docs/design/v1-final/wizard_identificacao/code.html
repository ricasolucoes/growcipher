<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>

<title>GrowCipher - Cadastro de Planta - Etapa 2</title>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-container-padding antialiased">
<!-- Top Navigation Placeholder (Hidden for flow) -->
<header class="hidden w-full absolute top-0 left-0 px-margin-mobile h-16 flex justify-between items-center bg-background">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-2xl">account_circle</span>
<span class="text-headline-md font-headline-md font-bold tracking-tight">GrowCipher</span>
</div>
<span class="material-symbols-outlined text-primary text-2xl">settings</span>
</header>
<main class="w-full max-w-md mx-auto bg-surface-container rounded-xl border border-secondary/20 shadow-2xl overflow-hidden relative z-10">
<!-- Progress Bar -->
<div class="w-full bg-surface-container-high h-1 relative">
<div class="absolute top-0 left-0 h-full bg-primary transition-all duration-500 w-2/9" style="width: 22.22%"></div>
</div>
<div class="p-container-padding flex flex-col gap-6">
<!-- Header -->
<div class="flex flex-col gap-2">
<span class="font-label-md text-label-md text-primary uppercase tracking-widest">Etapa 2 de 9</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface">Como você quer identificar esta planta?</h1>
</div>
<!-- Input Form -->
<div class="flex flex-col gap-4">
<!-- Nome Manual -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant flex justify-between items-center" for="plant-name">
                        Nome da planta
                        <span class="material-symbols-outlined text-base text-on-surface-variant" title="Vault Status: Encrypted">lock</span>
</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary text-on-surface font-label-md text-body-lg p-3 outline-none transition-colors" id="plant-name" placeholder="Ex: Alpha-1" type="text"/>
</div>
</div>
<!-- Ou / Gerar Código -->
<div class="relative flex py-2 items-center">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 font-label-sm text-label-sm text-outline">OU</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<button class="w-full bg-surface-container-high hover:bg-surface-variant border border-outline-variant rounded p-3 flex items-center justify-between transition-colors group" type="button">
<span class="font-label-md text-label-md text-on-surface group-hover:text-primary transition-colors">Gerar código aleatório</span>
<div class="flex items-center gap-2">
<span class="font-label-sm text-label-sm text-on-surface-variant opacity-70">Ex: GC-7F2A</span>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">autorenew</span>
</div>
</button>
</div>
<!-- Photo Upload Area -->
<div class="mt-4 border-2 border-dashed border-outline-variant rounded-lg bg-surface-container-lowest p-6 flex flex-col items-center justify-center text-center cursor-pointer hover:border-primary hover:bg-surface-container-high transition-all group">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mb-3 group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">add_a_photo</span>
</div>
<span class="font-label-md text-label-md text-primary mb-1">+ Adicionar foto</span>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center justify-center gap-1 mt-2 max-w-[200px] mx-auto leading-tight">
<span class="material-symbols-outlined text-[14px] text-outline">verified_user</span>
                    A foto fica armazenada localmente e protegida no seu cofre.
                </p>
</div>
<!-- Actions -->
<div class="flex gap-4 mt-8">
<button class="flex-1 border border-outline-variant text-on-surface hover:bg-surface-container-high hover:text-on-surface font-label-md text-label-md h-12 rounded transition-colors flex items-center justify-center" type="button">
                    Pular
                </button>
<button class="flex-1 bg-primary text-on-primary hover:bg-primary-fixed-dim font-label-md text-label-md h-12 rounded transition-colors flex items-center justify-center shadow-[0_2px_8px_rgba(87,241,219,0.15)] hover:shadow-[0_4px_12px_rgba(87,241,219,0.25)]" type="button">
                    Continuar
                </button>
</div>
</div>
</main>
<!-- Subtle Background Elements for Vault feel -->
<div class="fixed inset-0 pointer-events-none z-0 opacity-20" style="background-image: radial-gradient(circle at 50% 0%, #171f33 0%, transparent 70%);"></div>
</body></html>
