name: Release

on:
  push:
    # Só SemVer completo. A tag malformada `v1.0` (2 componentes) fica de fora
    # de propósito — ver docs/reprodutibilidade.md, seção "Higiene de tags".
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.44.9
  TZ: UTC
  LC_ALL: C.UTF-8

jobs:
  release:
    name: APK + SHA256
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: A tag tem que bater com o pubspec
        shell: bash
        run: |
          set -euo pipefail
          # Sem esta trava, nasce outra tag apontando para uma versão diferente
          # da que ela anuncia — foi exatamente o caso da tag v1.0 sobre 0.1.0+1.
          versao="$(sed -n -E 's/^version:[[:space:]]*(.+)$/\1/p' pubspec.yaml | head -1)"
          nome="${versao%%+*}"
          codigo="${versao##*+}"
          if [ "v${nome}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::A tag ${GITHUB_REF_NAME} não corresponde a version: ${versao} do pubspec.yaml (esperado v${nome})."
            exit 1
          fi
          {
            echo "VERSION_NAME=${nome}"
            echo "VERSION_CODE=${codigo}"
          } >> "$GITHUB_ENV"

      - name: Dependências (trava o pubspec.lock)
        run: flutter pub get --enforce-lockfile

      - name: Chave de assinatura, quando houver
        id: assinatura
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            # android/app/build.gradle.kts: sem key.properties o release sai NÃO
            # assinado. O Android recusa instalar um APK sem assinatura, então a
            # release é publicada como rascunho em vez de virar download quebrado.
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64 — o APK sai não assinado e a release fica como rascunho."
            echo "assinado=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          PROPS
          echo "assinado=true" >> "$GITHUB_OUTPUT"

      - name: Build do APK de release
        shell: bash
        run: |
          set -euo pipefail
          # Data do commit da tag no lugar do "agora": ver docs/reprodutibilidade.md.
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH ($(date -u -d "@$SOURCE_DATE_EPOCH" '+%Y-%m-%dT%H:%M:%SZ'))"
          flutter build apk --release

      - name: Apagar a chave do runner
        if: always()
        shell: bash
        run: rm -f android/key.properties android/app/upload-keystore.jks

      - name: SHA256 e corpo da release
        id: pacote
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          # A receita F-Droid e o link de download esperam este nome exato.
          test -f "$apk"
          sha="$(sha256sum "$apk" | cut -d' ' -f1)"
          echo "$sha  app-release.apk" > "${apk}.sha256"
          tamanho="$(du -h "$apk" | cut -f1)"

          if [ "${{ steps.assinatura.outputs.assinado }}" = "true" ]; then
            estado="APK assinado com a chave de upload do projeto."
          else
            estado=$'> ⚠️ **APK NÃO ASSINADO** — o Android recusa instalar. Configure os secrets `ANDROID_KEYSTORE_BASE64`, `ANDROID_KEYSTORE_PASSWORD`, `ANDROID_KEY_ALIAS` e `ANDROID_KEY_PASSWORD` e refaça a tag antes de publicar este rascunho.'
          fi

          cat > corpo.md <<CORPO
          ${estado}

          | | |
          |---|---|
          | versionName | \`${VERSION_NAME}\` |
          | versionCode | \`${VERSION_CODE}\` |
          | commit | \`${GITHUB_SHA}\` |
          | Flutter | \`${FLUTTER_VERSION}\` |
          | tamanho | ${tamanho} |

          **SHA256 de \`app-release.apk\`**

          \`\`\`
          ${sha}
          \`\`\`

          Conferindo o download:

          \`\`\`sh
          echo "${sha}  app-release.apk" | sha256sum -c -
          \`\`\`

          Mudanças desta versão: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md).
          Como reconstruir e comparar este APK: [docs/reprodutibilidade.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/reprodutibilidade.md).
          CORPO

          {
            echo "### APK \`${GITHUB_REF_NAME}\`"
            echo ""
            echo "\`\`\`"
            echo "$sha  app-release.apk"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          rascunho=()
          if [ "${{ steps.assinatura.outputs.assinado }}" != "true" ]; then
            rascunho=(--draft)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "GrowCipher ${GITHUB_REF_NAME}" \
            --notes-file corpo.md \
            "${rascunho[@]}" \
            "$apk" "${apk}.sha256"

      - name: Guardar o APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.ref_name }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
