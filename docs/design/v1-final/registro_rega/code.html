<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Registrar Rega - GrowCipher</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#ffdad6",
                        "on-secondary": "#233144",
                        "on-surface-variant": "#bacac5",
                        "surface-container-lowest": "#060e20",
                        "on-primary": "#003731",
                        "surface-tint": "#3cddc7",
                        "on-secondary-fixed": "#0d1c2f",
                        "secondary-fixed": "#d5e3fd",
                        "outline-variant": "#3c4a46",
                        "surface-container-low": "#131b2e",
                        "on-error": "#690005",
                        "tertiary-fixed": "#b0f0d6",
                        "tertiary-fixed-dim": "#95d3ba",
                        "outline": "#859490",
                        "surface": "#0b1326",
                        "primary-fixed": "#62fae3",
                        "tertiary-container": "#8ccbb2",
                        "surface-container": "#171f33",
                        "surface-bright": "#31394d",
                        "on-tertiary": "#003829",
                        "on-tertiary-fixed": "#002117",
                        "on-background": "#dae2fd",
                        "inverse-surface": "#dae2fd",
                        "surface-variant": "#2d3449",
                        "on-secondary-container": "#abb9d2",
                        "surface-dim": "#0b1326",
                        "surface-container-highest": "#2d3449",
                        "error-container": "#93000a",
                        "surface-container-high": "#222a3d",
                        "primary": "#57f1db",
                        "error": "#ffb4ab",
                        "tertiary": "#a8e7cd",
                        "on-primary-fixed-variant": "#005047",
                        "secondary-fixed-dim": "#b9c7e0",
                        "inverse-primary": "#006b5f",
                        "background": "#0b1326",
                        "on-tertiary-container": "#155743",
                        "inverse-on-surface": "#283044",
                        "on-tertiary-fixed-variant": "#0b513d",
                        "on-primary-container": "#00574d",
                        "on-primary-fixed": "#00201c",
                        "secondary": "#b9c7e0",
                        "on-surface": "#dae2fd",
                        "secondary-container": "#3c4a5e",
                        "on-secondary-fixed-variant": "#3a485c",
                        "primary-container": "#2dd4bf",
                        "primary-fixed-dim": "#3cddc7"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "container-padding": "24px",
                        "gutter": "16px",
                        "margin-desktop": "64px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-lg": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-lg": ["Inter"],
                        "title-lg": ["Hanken Grotesk"],
                        "label-md": ["JetBrains Mono"],
                        "display-lg": ["Hanken Grotesk"],
                        "label-sm": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400" }],
                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }],
                        "display-lg": ["57px", { "lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "700" }],
                        "label-sm": ["11px", { "lineHeight": "16px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-background dark:bg-background flex justify-between items-center w-full px-margin-mobile h-16 flat no shadows sticky top-0 z-40 border-b border-surface-container-high md:border-none">
<button aria-label="Voltar" class="text-on-surface-variant dark:text-on-surface-variant hover:opacity-80 transition-opacity p-2 -ml-2 rounded-full focus:outline-none focus:ring-2 focus:ring-primary-container">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-headline-md font-headline-md font-bold text-primary dark:text-primary tracking-tight">Registrar rega</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-margin-mobile md:px-margin-desktop py-container-padding max-w-3xl mx-auto w-full gap-6">
<!-- Transactional intent form -->
<form class="flex flex-col gap-8 w-full" id="wateringForm">
<!-- Quando Section -->
<section class="flex flex-col gap-3">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Quando?</label>
<div class="grid grid-cols-2 gap-3">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="timing" type="radio" value="now"/>
<div class="flex items-center justify-center gap-2 py-3 px-4 rounded-lg bg-surface-container-low border border-surface-variant text-on-surface peer-checked:bg-surface-container-highest peer-checked:border-primary peer-checked:text-primary transition-all">
<span class="material-symbols-outlined text-[20px]" data-icon="schedule">schedule</span>
<span class="font-label-md text-label-md">Agora</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="timing" type="radio" value="custom"/>
<div class="flex items-center justify-center gap-2 py-3 px-4 rounded-lg bg-surface-container-low border border-surface-variant text-on-surface peer-checked:bg-surface-container-highest peer-checked:border-primary peer-checked:text-primary transition-all">
<span class="material-symbols-outlined text-[20px]" data-icon="calendar_month">calendar_month</span>
<span class="font-label-md text-label-md">Agendar</span>
</div>
</label>
</div>
</section>
<!-- Quantidade Section -->
<section class="flex flex-col gap-3">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="amount">Quantidade <span class="text-outline text-label-sm">(Opcional)</span></label>
<div class="relative flex items-center">
<span class="absolute left-4 material-symbols-outlined text-outline" data-icon="water_drop">water_drop</span>
<input class="w-full bg-surface-container-low border border-surface-variant rounded-lg py-3 pl-12 pr-16 text-on-surface font-label-md focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none placeholder:text-outline-variant" id="amount" placeholder="Ex: 500" type="number"/>
<span class="absolute right-4 font-label-md text-on-surface-variant">ml</span>
</div>
</section>
<!-- Tipo de Solução Section -->
<section class="flex flex-col gap-3">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Água / Solução</label>
<div class="flex flex-wrap gap-2">
<label class="cursor-pointer flex-grow sm:flex-grow-0">
<input checked="" class="peer sr-only" name="solution" type="radio" value="water"/>
<div class="px-4 py-2 rounded-full border border-surface-variant bg-surface-container-lowest text-on-surface font-label-sm text-label-sm peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[16px]" data-icon="water_drop">water_drop</span>
                            Água
                        </div>
</label>
<label class="cursor-pointer flex-grow sm:flex-grow-0">
<input class="peer sr-only" name="solution" type="radio" value="nutrients"/>
<div class="px-4 py-2 rounded-full border border-surface-variant bg-surface-container-lowest text-on-surface font-label-sm text-label-sm peer-checked:bg-tertiary-container peer-checked:text-on-tertiary-container peer-checked:border-tertiary-container transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[16px]" data-icon="science">science</span>
                            Água + Nutrientes
                        </div>
</label>
<label class="cursor-pointer flex-grow sm:flex-grow-0">
<input class="peer sr-only" name="solution" type="radio" value="other"/>
<div class="px-4 py-2 rounded-full border border-surface-variant bg-surface-container-lowest text-on-surface font-label-sm text-label-sm peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-secondary-container transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[16px]" data-icon="more_horiz">more_horiz</span>
                            Outra
                        </div>
</label>
</div>
</section>
<!-- Observação Section -->
<section class="flex flex-col gap-3">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="notes">Observação <span class="text-outline text-label-sm">(Opcional)</span></label>
<textarea class="w-full bg-surface-container-low border border-surface-variant rounded-lg py-3 px-4 text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none placeholder:text-outline-variant resize-none" id="notes" placeholder="Adicione notas sobre ph, ec, ou estado da planta..." rows="3"></textarea>
</section>
</form>
</main>
<!-- Bottom Action Bar (Contextual FAB equivalent for transactional screens) -->
<div class="fixed bottom-0 left-0 w-full p-4 bg-background border-t border-surface-container md:relative md:bg-transparent md:border-none md:mt-8 md:p-0 z-40">
<div class="max-w-3xl mx-auto flex gap-4">
<button class="hidden md:flex flex-1 items-center justify-center py-4 px-6 rounded-lg border border-surface-variant text-on-surface font-label-md text-label-md uppercase tracking-wider hover:bg-surface-container-low transition-colors" type="button">
                Cancelar
            </button>
<button class="flex-1 bg-primary text-on-primary-fixed font-label-md text-label-md uppercase tracking-wider py-4 px-6 rounded-lg flex items-center justify-center gap-2 hover:bg-primary-fixed transition-colors shadow-sm" form="wateringForm" type="submit">
<span class="material-symbols-outlined icon-fill" data-icon="save">save</span>
                SALVAR REGA
            </button>
</div>
</div>
<!-- Suppress Navigation Shell on Transactional Screen -->
</body></html>
