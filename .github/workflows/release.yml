name: Release & Google Play Store

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track (production, internal, beta)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - internal
          - beta

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.44.9
  TZ: UTC
  LC_ALL: C.UTF-8

jobs:
  release:
    name: Build APK, AAB & Publish to Google Play
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Play API Dependencies
        run: |
          pip install google-api-python-client google-auth google-auth-httplib2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Validar e extrair versão da tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            nome="${GITHUB_REF_NAME#v}"
          else
            nome="$(sed -n -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9]+)?$/\1/p' pubspec.yaml | head -1)"
            if [[ -z "$nome" ]]; then
              echo "Tag inválida: esperado vX.Y.Z, recebido $GITHUB_REF_NAME" >&2
              exit 1
            fi
          fi
          IFS=. read -r major minor patch <<< "$nome"
          codigo="$((major * 1000000 + minor * 1000 + patch))"
          echo "VERSION_NAME=${nome}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${codigo}" >> "$GITHUB_ENV"
          echo "Versão: ${nome} (code: ${codigo})"

      - name: Dependências (trava o pubspec.lock)
        run: flutter pub get --enforce-lockfile

      - name: Configurar Chaves de Assinatura e Google Play
        id: assinatura
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_KEY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/keystores
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          PROPS
            echo "assinado=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64"
            echo "assinado=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "${PLAY_KEY_JSON:-}" ]; then
            echo "$PLAY_KEY_JSON" > /tmp/keystores/play-service-account.json
            chmod 600 /tmp/keystores/play-service-account.json
          fi

      - name: Build do APK e AAB de release
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          flutter build apk --release --build-name "$VERSION_NAME" --build-number "$VERSION_CODE"
          flutter build appbundle --release --build-name "$VERSION_NAME" --build-number "$VERSION_CODE"

      - name: Apagar a chave do runner
        if: always()
        shell: bash
        run: rm -f android/key.properties android/app/upload-keystore.jks

      - name: SHA256 e corpo da release
        id: pacote
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          aab=build/app/outputs/bundle/release/app-release.aab
          sha="$(sha256sum "$apk" | cut -d' ' -f1)"
          echo "$sha  app-release.apk" > "${apk}.sha256"
          tamanho="$(du -h "$apk" | cut -f1)"

          cat > corpo.md <<CORPO
          Release oficial do GrowCipher.

          | Propriedade | Valor |
          |---|---|
          | versionName | \`${VERSION_NAME}\` |
          | versionCode | \`${VERSION_CODE}\` |
          | commit | \`${GITHUB_SHA}\` |
          | Flutter | \`${FLUTTER_VERSION}\` |
          | tamanho | ${tamanho} |

          **SHA256 de \`app-release.apk\`**
          \`\`\`
          ${sha}
          \`\`\`
          CORPO

      - name: Publicar na Google Play Store & Sincronizar Metadados
        if: steps.assinatura.outputs.assinado == 'true'
        env:
          TRACK: ${{ github.event.inputs.track || 'production' }}
        run: |
          if [ -f /tmp/keystores/play-service-account.json ]; then
            python3 scripts/play_store_publish.py \
              --package com.sierratecnologia.growcipher \
              --aab build/app/outputs/bundle/release/app-release.aab \
              --track "$TRACK" \
              --metadata-dir fastlane/metadata/android \
              --key /tmp/keystores/play-service-account.json
          fi

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          aab=build/app/outputs/bundle/release/app-release.aab
          gh release create "${GITHUB_REF_NAME}" \
            --title "GrowCipher ${GITHUB_REF_NAME}" \
            --notes-file corpo.md \
            "$apk" "${apk}.sha256" "$aab" || true
