<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GrowCipher - Cadastro de Planta Etapa 1</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#ffdad6",
                        "on-secondary": "#233144",
                        "on-surface-variant": "#bacac5",
                        "surface-container-lowest": "#060e20",
                        "on-primary": "#003731",
                        "surface-tint": "#3cddc7",
                        "on-secondary-fixed": "#0d1c2f",
                        "secondary-fixed": "#d5e3fd",
                        "outline-variant": "#3c4a46",
                        "surface-container-low": "#131b2e",
                        "on-error": "#690005",
                        "tertiary-fixed": "#b0f0d6",
                        "tertiary-fixed-dim": "#95d3ba",
                        "outline": "#859490",
                        "surface": "#0b1326",
                        "primary-fixed": "#62fae3",
                        "tertiary-container": "#8ccbb2",
                        "surface-container": "#171f33",
                        "surface-bright": "#31394d",
                        "on-tertiary": "#003829",
                        "on-tertiary-fixed": "#002117",
                        "on-background": "#dae2fd",
                        "inverse-surface": "#dae2fd",
                        "surface-variant": "#2d3449",
                        "on-secondary-container": "#abb9d2",
                        "surface-dim": "#0b1326",
                        "surface-container-highest": "#2d3449",
                        "error-container": "#93000a",
                        "surface-container-high": "#222a3d",
                        "primary": "#57f1db",
                        "error": "#ffb4ab",
                        "tertiary": "#a8e7cd",
                        "on-primary-fixed-variant": "#005047",
                        "secondary-fixed-dim": "#b9c7e0",
                        "inverse-primary": "#006b5f",
                        "background": "#0b1326",
                        "on-tertiary-container": "#155743",
                        "inverse-on-surface": "#283044",
                        "on-tertiary-fixed-variant": "#0b513d",
                        "on-primary-container": "#00574d",
                        "on-primary-fixed": "#00201c",
                        "secondary": "#b9c7e0",
                        "on-surface": "#dae2fd",
                        "secondary-container": "#3c4a5e",
                        "on-secondary-fixed-variant": "#3a485c",
                        "primary-container": "#2dd4bf",
                        "primary-fixed-dim": "#3cddc7"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "container-padding": "24px",
                        "gutter": "16px",
                        "margin-desktop": "64px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-lg": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-lg": ["Inter"],
                        "title-lg": ["Hanken Grotesk"],
                        "label-md": ["JetBrains Mono"],
                        "display-lg": ["Hanken Grotesk"],
                        "label-sm": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400" }],
                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }],
                        "display-lg": ["57px", { "lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "700" }],
                        "label-sm": ["11px", { "lineHeight": "16px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .option-card.selected {
            border-color: theme('colors.primary');
            background-color: theme('colors.surface-container-highest');
        }
        .option-card.selected .icon-container {
            color: theme('colors.primary');
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Suppressed typical App Bar due to Wizard flow, using simplified header) -->
<header class="w-full h-16 flex items-center px-margin-mobile md:px-margin-desktop justify-between border-b border-surface-container-high bg-background z-10 sticky top-0">
<button aria-label="Voltar" class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex items-center space-x-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">GrowCipher</span>
</div>
<div class="w-10 h-10"></div> <!-- Spacer for flex alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-start pt-8 pb-32 px-margin-mobile md:px-container-padding w-full max-w-[800px] mx-auto">
<!-- Progress Indicator -->
<div class="w-full flex flex-col items-center mb-8 md:mb-12">
<div class="font-label-md text-label-md text-primary mb-3 uppercase tracking-widest">Etapa 1 de 9</div>
<div class="flex space-x-1 mb-6">
<div class="w-8 h-1 bg-primary rounded-full"></div>
<div class="w-8 h-1 bg-surface-container-high rounded-full"></div>
<div class="w-8 h-1 bg-surface-container-high rounded-full"></div>
<div class="w-8 h-1 bg-surface-container-high rounded-full"></div>
<div class="w-8 h-1 bg-surface-container-high rounded-full"></div>
<div class="w-8 h-1 bg-surface-container-high rounded-full"></div>
<div class="w-8 h-1 bg-surface-container-high rounded-full"></div>
<div class="w-8 h-1 bg-surface-container-high rounded-full"></div>
<div class="w-8 h-1 bg-surface-container-high rounded-full"></div>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-center text-on-surface mb-2">Vamos cadastrar sua planta</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant text-center max-w-md">O que você tem agora?</p>
</div>
<!-- Options Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">
<!-- Option 1: Semente -->
<button class="option-card flex flex-col items-start p-6 rounded-xl border border-surface-container-high bg-surface-container-low hover:bg-surface-container hover:border-surface-variant transition-all duration-200 text-left w-full group relative overflow-hidden" onclick="selectOption(this)">
<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
<div class="icon-container w-12 h-12 rounded-lg bg-surface flex items-center justify-center mb-4 text-on-surface-variant border border-surface-container-high transition-colors">
<span class="text-2xl">🌰</span>
</div>
<h3 class="font-title-lg text-title-lg text-on-surface mb-2">Semente</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Você está começando a partir de uma semente.</p>
<div class="mt-4 flex items-center space-x-2 text-primary opacity-0 group-[.selected]:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider">Selecionado</span>
</div>
</button>
<!-- Option 2: Muda -->
<button class="option-card flex flex-col items-start p-6 rounded-xl border border-surface-container-high bg-surface-container-low hover:bg-surface-container hover:border-surface-variant transition-all duration-200 text-left w-full group relative overflow-hidden" onclick="selectOption(this)">
<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
<div class="icon-container w-12 h-12 rounded-lg bg-surface flex items-center justify-center mb-4 text-on-surface-variant border border-surface-container-high transition-colors">
<span class="text-2xl">🌱</span>
</div>
<h3 class="font-title-lg text-title-lg text-on-surface mb-2">Muda</h3>
<p class="font-body-md text-body-md text-on-surface-variant">A planta já germinou e começou a crescer.</p>
<div class="mt-4 flex items-center space-x-2 text-primary opacity-0 group-[.selected]:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider">Selecionado</span>
</div>
</button>
<!-- Option 3: Clone -->
<button class="option-card flex flex-col items-start p-6 rounded-xl border border-surface-container-high bg-surface-container-low hover:bg-surface-container hover:border-surface-variant transition-all duration-200 text-left w-full group relative overflow-hidden" onclick="selectOption(this)">
<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
<div class="icon-container w-12 h-12 rounded-lg bg-surface flex items-center justify-center mb-4 text-on-surface-variant border border-surface-container-high transition-colors">
<span class="text-2xl">🌿</span>
</div>
<h3 class="font-title-lg text-title-lg text-on-surface mb-2">Clone</h3>
<p class="font-body-md text-body-md text-on-surface-variant">A planta veio de outra planta.</p>
<div class="mt-4 flex items-center space-x-2 text-primary opacity-0 group-[.selected]:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider">Selecionado</span>
</div>
</button>
<!-- Option 4: Planta em andamento -->
<button class="option-card flex flex-col items-start p-6 rounded-xl border border-surface-container-high bg-surface-container-low hover:bg-surface-container hover:border-surface-variant transition-all duration-200 text-left w-full group relative overflow-hidden" onclick="selectOption(this)">
<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
<div class="icon-container w-12 h-12 rounded-lg bg-surface flex items-center justify-center mb-4 text-on-surface-variant border border-surface-container-high transition-colors">
<span class="text-2xl">🪴</span>
</div>
<h3 class="font-title-lg text-title-lg text-on-surface mb-2">Planta em andamento</h3>
<p class="font-body-md text-body-md text-on-surface-variant">O cultivo já começou e você quer acompanhar agora.</p>
<div class="mt-4 flex items-center space-x-2 text-primary opacity-0 group-[.selected]:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider">Selecionado</span>
</div>
</button>
</div>
</main>
<!-- Bottom Action Bar (Contextual FAB Replacement for Transactional Flow) -->
<div class="fixed bottom-0 left-0 w-full bg-background border-t border-surface-container-high p-4 md:p-6 z-20 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
<div class="max-w-[800px] mx-auto flex justify-end">
<button class="bg-surface-container-highest text-on-surface-variant font-label-md text-label-md px-8 py-3 rounded-lg flex items-center justify-center transition-all duration-300 opacity-50 cursor-not-allowed uppercase tracking-wider h-12 min-w-[160px]" disabled="" id="continueBtn">
<span>Continuar</span>
<span class="material-symbols-outlined ml-2 text-lg">arrow_forward</span>
</button>
</div>
</div>
<script>
        function selectOption(element) {
            // Remove 'selected' class from all options
            const options = document.querySelectorAll('.option-card');
            options.forEach(opt => {
                opt.classList.remove('selected');
            });
            
            // Add 'selected' class to clicked option
            element.classList.add('selected');

            // Enable Continue button
            const continueBtn = document.getElementById('continueBtn');
            continueBtn.disabled = false;
            
            // Update button styling to active state
            continueBtn.classList.remove('bg-surface-container-highest', 'text-on-surface-variant', 'opacity-50', 'cursor-not-allowed');
            continueBtn.classList.add('bg-primary', 'text-on-primary', 'hover:bg-primary-container', 'hover:text-on-primary-container', 'shadow-lg', 'shadow-primary/20');
        }
    </script>
</body></html>
